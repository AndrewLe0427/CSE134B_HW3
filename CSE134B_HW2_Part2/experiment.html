<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>"Experience Page"</title>
</head>
<body>
  <header>
    <iframe src="nav.html" title="Site navigation"></iframe>
  </header>
  <main>
    <h1>Experiments</h1>
    <section>
      <h2>Template</h2>
      <template id="note-template">
        <article>
          <h3>Template heading</h3>
          <p>Template paragraph.</p>
        </article>
      </template>
    </section>

    <section>
      <h2>Audio</h2>
      <audio controls>
        <source src="placeholder.mp3">
      </audio>
    </section>
    
    <section>
      <h2>Video</h2>
      <video controls width="100" height="100">
        <source src="placeholder.mp4">
      </video>
    </section>

    <section>
      <h2>Canvas</h2>
      <canvas id="shape">
      </canvas>

      <script>
        const canvas = document.getElementById("shape");
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#000";
        ctx.fillRect(10, 10, 80, 50);
        ctx.beginPath();
        ctx.arc(150, 50, 30, 0, 2 * Math.PI);
        ctx.stroke();
      </script>
    </section>

    <section>
      <h2>MathML</h2>
      <math display="block">
        <mi>E</mi>
        <mo>=</mo>
        <mi>m</mi>
        <msup>
          <mi>c</mi>
          <mn>2</mn>
        </msup>
      </math>
      <p>I guess Chrome and Edge just hate MathML. They don't support it until 2023. However, the feature is not fully usable.</p>
    </section>
  </main>
  <footer>
    <p>&copy; 2026 Andrew Le</p>
  </footer>
</body>
</html>
